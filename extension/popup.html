<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1e1e1e;
    --surface: #2a2a2a;
    --border: #3a3a3a;
    --text: #c8c8c8;
    --text-dim: #888;
    --accent: #6a9955;
    --warn: #c97a7a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 300px;
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    padding: 16px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; color: #ddd; }
  header .ver { font-size: 10px; color: var(--text-dim); }

  .section { margin-bottom: 14px; }
  .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  /* Server status */
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface);
    border-radius: 6px;
    font-size: 12px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }
  .status-dot.online { background: #6a9955; }
  .status-dot.offline { background: #c97a7a; }

  /* Buttons */
  .btn {
    display: block;
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 12px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
  }
  .btn:hover { border-color: #555; background: #333; }
  .btn.primary { background: var(--accent); color: #1e1e1e; border-color: var(--accent); }
  .btn.primary:hover { background: #7eb865; }
  .btn.warn { color: var(--warn); }
  .btn.warn:hover { background: rgba(201,122,122,0.1); }

  /* Toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }
  .toggle-track {
    width: 40px; height: 22px;
    background: #444;
    border-radius: 11px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-track.on { background: var(--accent); }
  .toggle-thumb {
    width: 18px; height: 18px;
    background: #ddd;
    border-radius: 50%;
    position: absolute;
    top: 2px; left: 2px;
    transition: left 0.2s;
  }
  .toggle-track.on .toggle-thumb { left: 20px; }

  /* Vocab stats */
  .vocab-stats {
    display: flex;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .vocab-stats span {
    padding: 2px 8px;
    background: var(--surface);
    border-radius: 4px;
    white-space: nowrap;
  }

  hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
</style>
</head>
<body>

<header>
  <h1>🧠 ThesisGlow Lite</h1>
  <span class="ver">v1.0</span>
</header>

<div class="section">
  <div class="section-title">Server</div>
  <div class="status-row">
    <div class="status-dot" id="serverDot"></div>
    <span id="serverText">Checking...</span>
  </div>
</div>

<div class="section">
  <div class="section-title">Scan Mode</div>
  <div class="toggle-row">
    <span>Auto-Scan</span>
    <div class="toggle-track" id="autoToggle">
      <div class="toggle-thumb"></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Actions</div>
  <button class="btn" id="btnScan">🔍 Scan Page</button>
  <button class="btn primary" id="btnGlowAll">✨ Glow All Blocks</button>
  <button class="btn warn" id="btnRestore">↩ Restore Original</button>
</div>

<div class="section">
  <div class="section-title">Vocabulary</div>
  <div class="vocab-stats">
    <span id="vocabTotal">— total</span>
    <span id="vocabKnown">— known</span>
    <span id="vocabLearning">— learning</span>
  </div>
  <button class="btn warn" id="btnResetVocab" style="margin-top:6px;">🗑 Reset Vocabulary</button>
</div>

<script src="popup.js"></script>
</body>
</html>
